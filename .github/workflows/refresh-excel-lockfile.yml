name: Refresh Excel import lockfile
on:
  push:
    branches:
      - feat/ganadia-sprint1-excel-preview
    paths:
      - package.json
      - .github/workflows/refresh-excel-lockfile.yml
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ganadia-sprint1-excel-preview
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: refresh lockfile for safe Excel preview readers"
            git push origin HEAD:feat/ganadia-sprint1-excel-preview
          fi
